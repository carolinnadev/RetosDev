<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weather Globe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #02050b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    #globe {
      position: fixed;
      inset: 0;
    }

    /* Panel superior */

    .header {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }

    .header p {
      margin-top: 6px;
      color: #8e99aa;
      font-size: 14px;
    }

    /* Tarjeta del clima */

    .weather-card {
      position: fixed;
      right: 35px;
      top: 50%;
      transform: translateY(-50%);

      width: 280px;
      padding: 24px;

      background: rgba(10, 16, 28, 0.78);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;

      backdrop-filter: blur(15px);

      z-index: 10;
    }

    .location {
      color: #9ba7b8;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .temperature {
      font-size: 55px;
      font-weight: 300;
      margin: 5px 0;
    }

    .condition {
      color: #c7d0dc;
      margin-bottom: 20px;
    }

    .data {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .data-box {
      padding: 12px;

      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }

    .data-box span {
      display: block;
      color: #8793a5;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .data-box strong {
      font-size: 15px;
    }

    /* Indicador */

    .hint {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);

      color: #657185;
      font-size: 12px;

      z-index: 10;
    }

    @media (max-width: 700px) {

      .header {
        top: 20px;
        left: 20px;
      }

      .header h1 {
        font-size: 22px;
      }

      .weather-card {
        right: 15px;
        left: 15px;
        top: auto;
        bottom: 45px;
        transform: none;
        width: auto;
      }

      .temperature {
        font-size: 42px;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="globe"></div>

  <div class="header">
    <h1>Weather Globe</h1>
    <p>Real-time weather</p>
  </div>


  <div class="weather-card">

    <div class="location">
      📍 Medellín, Colombia
    </div>

    <div class="temperature">
      24°C
    </div>

    <div class="condition">
      ☁️ Parcialmente nublado
    </div>

    <div class="data">

      <div class="data-box">
        <span>Humedad</span>
        <strong>72%</strong>
      </div>

      <div class="data-box">
        <span>Viento</span>
        <strong>8 km/h</strong>
      </div>

      <div class="data-box">
        <span>Sensación</span>
        <strong>25°C</strong>
      </div>

      <div class="data-box">
        <span>Presión</span>
        <strong>1012 hPa</strong>
      </div>

    </div>

  </div>


  <div class="hint">
    Arrastra para explorar la Tierra
  </div>


  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";


    /* =====================================================
       ESCENA
    ===================================================== */

    const scene = new THREE.Scene();


    /* =====================================================
       CÁMARA
    ===================================================== */

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.z = 3;


    /* =====================================================
       RENDERER
    ===================================================== */

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    document
      .getElementById("globe")
      .appendChild(renderer.domElement);


    /* =====================================================
       ESTRELLAS
    ===================================================== */

    const starGeometry =
      new THREE.BufferGeometry();

    const starCount = 3000;

    const starPositions =
      new Float32Array(starCount * 3);


    for (let i = 0; i < starCount * 3; i++) {

      starPositions[i] =
        (Math.random() - 0.5) * 100;

    }


    starGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        starPositions,
        3
      )
    );


    const starMaterial =
      new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.08
      });


    const stars =
      new THREE.Points(
        starGeometry,
        starMaterial
      );

    scene.add(stars);


    /* =====================================================
       TIERRA
    ===================================================== */

    const earthGroup =
      new THREE.Group();

    scene.add(earthGroup);


    const earthGeometry =
      new THREE.SphereGeometry(
        1,
        96,
        96
      );


    const textureLoader =
      new THREE.TextureLoader();


    const earthTexture =
      textureLoader.load(
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
      );


    const earthMaterial =
      new THREE.MeshPhongMaterial({
        map: earthTexture,
        shininess: 5
      });


    const earth =
      new THREE.Mesh(
        earthGeometry,
        earthMaterial
      );


    earthGroup.add(earth);


    /* =====================================================
       ATMÓSFERA
    ===================================================== */

    const atmosphereGeometry =
      new THREE.SphereGeometry(
        1.035,
        96,
        96
      );


    const atmosphereMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x4aa8ff,
        transparent: true,
        opacity: 0.12,
        side: THREE.BackSide
      });


    const atmosphere =
      new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
      );


    earthGroup.add(atmosphere);


    /* =====================================================
       LUCES
    ===================================================== */

    const sunLight =
      new THREE.DirectionalLight(
        0xffffff,
        2.5
      );


    sunLight.position.set(
      5,
      3,
      5
    );


    scene.add(sunLight);


    const ambientLight =
      new THREE.AmbientLight(
        0x557799,
        0.35
      );


    scene.add(ambientLight);


    /* =====================================================
       MARCADOR DE MEDELLÍN
    ===================================================== */

    const markerGeometry =
      new THREE.SphereGeometry(
        0.025,
        16,
        16
      );


    const markerMaterial =
      new THREE.MeshBasicMaterial({
        color: 0xff4d4d
      });


    const medellin =
      new THREE.Mesh(
        markerGeometry,
        markerMaterial
      );


    /*
      Coordenadas aproximadas de Medellín.

      Latitud: 6.24°
      Longitud: -75.58°
    */


    const latitude =
      6.24 * Math.PI / 180;

    const longitude =
      -75.58 * Math.PI / 180;


    const radius = 1.025;


    const x =
      radius *
      Math.cos(latitude) *
      Math.cos(longitude);

    const y =
      radius *
      Math.sin(latitude);

    const z =
      radius *
      Math.cos(latitude) *
      Math.sin(longitude);


    medellin.position.set(
      x,
      y,
      z
    );


    earthGroup.add(medellin);


    /* =====================================================
       ANILLO DEL MARCADOR
    ===================================================== */

    const ringGeometry =
      new THREE.RingGeometry(
        0.035,
        0.05,
        32
      );


    const ringMaterial =
      new THREE.MeshBasicMaterial({
        color: 0xff4d4d,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide
      });


    const ring =
      new THREE.Mesh(
        ringGeometry,
        ringMaterial
      );


    ring.position.copy(
      medellin.position
    );


    /*
      Orientar el anillo
      hacia afuera de la Tierra.
    */

    ring.lookAt(
      medellin.position.clone().multiplyScalar(2)
    );


    earthGroup.add(ring);


    /* =====================================================
       ROTACIÓN
    ===================================================== */

    let rotationSpeed = 0.0015;


    /* =====================================================
       INTERACCIÓN CON EL MOUSE
    ===================================================== */

    let dragging = false;

    let previousX = 0;

    let previousY = 0;


    renderer.domElement.addEventListener(
      "pointerdown",
      (event) => {

        dragging = true;

        previousX = event.clientX;
        previousY = event.clientY;

      }
    );


    renderer.domElement.addEventListener(
      "pointermove",
      (event) => {

        if (!dragging) return;


        const deltaX =
          event.clientX - previousX;

        const deltaY =
          event.clientY - previousY;


        earthGroup.rotation.y +=
          deltaX * 0.005;


        earthGroup.rotation.x +=
          deltaY * 0.005;


        earthGroup.rotation.x =
          Math.max(
            -0.8,
            Math.min(
              0.8,
              earthGroup.rotation.x
            )
          );


        previousX =
          event.clientX;

        previousY =
          event.clientY;

      }
    );


    renderer.domElement.addEventListener(
      "pointerup",
      () => {

        dragging = false;

      }
    );


    renderer.domElement.addEventListener(
      "pointerleave",
      () => {

        dragging = false;

      }
    );


    /* =====================================================
       ANIMACIÓN
    ===================================================== */

    function animate() {

      requestAnimationFrame(
        animate
      );


      if (!dragging) {

        earthGroup.rotation.y +=
          rotationSpeed;

      }


      /*
        Animación del marcador
      */

      const pulse =
        1 +
        Math.sin(
          Date.now() * 0.005
        ) * 0.25;


      ring.scale.set(
        pulse,
        pulse,
        pulse
      );


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
